name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Check free-only transcription policy
        shell: bash
        run: |
          if grep -RniE 'api\.groq\.com|api\.openai\.com|Authorization: Bearer|gsk_|sk-[A-Za-z0-9]' app/src; then
            echo 'Paid or credential-based speech API reference found.'
            exit 1
          fi
          test -f app/src/main/cpp/whisper_jni.cpp
          test -f app/src/main/java/com/kuiro/youtubemarker/transcription/WhisperEngine.kt
      - name: Build, lint, and unit test
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youtubemarker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
